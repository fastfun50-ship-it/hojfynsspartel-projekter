<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ECC align — HFS foto</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
    h1 { font-size: 18px; font-weight: 600; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    figure { margin: 0; }
    canvas, img { max-width: 320px; height: auto; background: #000; display: block; }
    label { display: block; margin: 8px 0 4px; font-size: 13px; color: #aaa; }
    button { margin-top: 12px; padding: 8px 14px; }
    #meta { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; margin-top: 12px; }
    .slider-wrap { position: relative; max-width: 320px; overflow: hidden; }
    .slider-wrap canvas { position: absolute; left: 0; top: 0; }
    #afterLayer { clip-path: inset(0 50% 0 0); }
  </style>
</head>
<body>
  <h1>ECC før/efter-align</h1>
  <p>Vælg før og efter. Algoritmen matcher similarity (flyt + lille rotation + skala). Overlay gemmes ikke.</p>
  <label>Før <input type="file" id="before" accept="image/*" /></label>
  <label>Efter <input type="file" id="after" accept="image/*" /></label>
  <button id="run" type="button">Align</button>
  <div class="row" style="margin-top:16px">
    <figure><figcaption>Før</figcaption><canvas id="cBefore"></canvas></figure>
    <figure><figcaption>Efter aligned</figcaption><canvas id="cAfter"></canvas></figure>
    <figure>
      <figcaption>Slider-preview (træk)</figcaption>
      <div class="slider-wrap" id="wrap">
        <canvas id="sBefore"></canvas>
        <canvas id="afterLayer"></canvas>
      </div>
      <input type="range" id="split" min="0" max="100" value="50" style="width:320px" />
    </figure>
  </div>
  <div id="meta"></div>
  <script src="../src/lib/ecc-align.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let beforeImg, afterImg;

    function loadFile(input) {
      return new Promise((resolve) => {
        const f = input.files[0];
        if (!f) return resolve(null);
        const url = URL.createObjectURL(f);
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = url;
      });
    }

    function draw(canvas, src) {
      canvas.width = src.width || src.naturalWidth;
      canvas.height = src.height || src.naturalHeight;
      canvas.getContext("2d").drawImage(src, 0, 0, canvas.width, canvas.height);
    }

    $("run").onclick = async () => {
      beforeImg = await loadFile($("before"));
      afterImg = await loadFile($("after"));
      if (!beforeImg || !afterImg) {
        $("meta").textContent = "Vælg begge billeder.";
        return;
      }
      $("meta").textContent = "Kører ECC…";
      const t0 = performance.now();
      const res = await EccAlign.eccAlign(beforeImg, afterImg, {
        maxSide: 480,
        levels: 4,
        maxIter: 14,
        minEcc: 0.35,
      });
      const ms = Math.round(performance.now() - t0);
      draw($("cBefore"), beforeImg);
      draw($("cAfter"), res.alignedCanvas);
      draw($("sBefore"), beforeImg);
      draw($("afterLayer"), res.alignedCanvas);
      const wrap = $("wrap");
      wrap.style.height = $("sBefore").getBoundingClientRect().height + "px";
      $("meta").textContent =
        (res.ok ? "OK" : "SVAG MATCH — gem raw og tilbyd tag om") +
        "\necc=" + res.ecc.toFixed(4) +
        "\nscale=" + res.warp.scale.toFixed(4) +
        "\nrot=" + res.warp.rotationDeg.toFixed(3) + "°" +
        "\ntx=" + res.warp.tx.toFixed(1) + " ty=" + res.warp.ty.toFixed(1) +
        "\n" + ms + " ms";
    };

    $("split").oninput = (e) => {
      const p = 100 - Number(e.target.value);
      $("afterLayer").style.clipPath = "inset(0 " + p + "% 0 0)";
    };
  </script>
</body>
</html>
